<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predictor de talles · Pavé</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#fff; color:#111; margin:0; padding:1.25rem; max-width:520px; }
  h1 { font-size:1.3rem; margin:0 0 .25rem; }
  p.sub { margin:0 0 1rem; color:#555; font-size:.9rem; }
  label { display:block; font-size:.9rem; margin-top:.75rem; }
  input { width:100%; box-sizing:border-box; padding:.5rem; font-size:1rem; border:1px solid #bbb; border-radius:6px; margin-top:.25rem; }
  button { margin-top:1rem; width:100%; padding:.7rem; font-size:1rem; border:0; border-radius:6px; background:#111; color:#fff; cursor:pointer; }
  .resultado { margin-top:1.25rem; padding:1rem; border:1px solid #ddd; border-radius:8px; }
  .talle { font-size:2rem; font-weight:700; }
  .detalle { font-size:.9rem; color:#444; margin-top:.5rem; }
  .aviso { font-size:.8rem; color:#777; margin-top:1rem; }
  .error { color:#b00020; font-size:.9rem; margin-top:.75rem; }
</style>
</head>
<body>
<h1>Predictor de talles</h1>
<p class="sub">Ingresá tus medidas en centímetros. Te damos el talle de Trisuit, Jersey y Calza de Pavé.</p>

<label>Pecho (cm)<input id="pecho" type="number" step="0.5" inputmode="decimal"></label>
<label>Cintura (cm) <small>opcional</small><input id="cintura" type="number" step="0.5" inputmode="decimal"></label>
<label>Cadera (cm) <small>opcional</small><input id="cadera" type="number" step="0.5" inputmode="decimal"></label>

<button id="calcular">Calcular talle</button>
<div id="salida"></div>

<p class="aviso">Regla: para cada prenda se elige el talle más chico que cubre tus medidas. Los talles son orientativos.</p>

<script>
var TALLES = ['XS','S','M','L','XL','XXL'];
var TABLAS = {
  trisuit: { pecho: [80,85,90,95,100,105], cintura: [65,70,75,80,85,90], cadera: [89,94,99,104,109,114] },
  jersey:  { pecho: [86,90,94,98,104,110], cintura: [72,76,80,84,90,96] },
  calza:   { cintura: [66,70,74,78,84,90], cadera: [88,92,96,100,106,112] }
};
var NOMBRES = { trisuit: 'Trisuit', jersey: 'Jersey', calza: 'Calza', top: 'Top femenino (solo pecho)' };

function talleMinimo(medidas, tabla) {
  for (var i = 0; i < TALLES.length; i++) {
    var ok = true;
    for (var k in medidas) {
      if (tabla[k][i] < medidas[k]) { ok = false; break; }
    }
    if (ok) return i;
  }
  return -1;
}

function leer(id) {
  var v = document.getElementById(id).value;
  return v === '' ? null : parseFloat(v.replace(',', '.'));
}

document.getElementById('calcular').addEventListener('click', function() {
  var p = leer('pecho'), c = leer('cintura'), h = leer('cadera');
  var salida = document.getElementById('salida');
  var resultados = [];
  if (p !== null && c !== null && h !== null) resultados.push(['trisuit', { pecho: p, cintura: c, cadera: h }, TABLAS.trisuit]);
  if (p !== null && c !== null) resultados.push(['jersey', { pecho: p, cintura: c }, TABLAS.jersey]);
  if (c !== null && h !== null) resultados.push(['calza', { cintura: c, cadera: h }, TABLAS.calza]);
  if (p !== null && c === null && h === null) resultados.push(['top', { pecho: p }, { pecho: TABLAS.jersey.pecho }]);
  if (!resultados.length) {
    salida.innerHTML = '<p class="error">Ingresá al menos una combinación: pecho solo (top femenino), pecho + cintura (jersey), cintura + cadera (calza), o las tres (Trisuit).</p>';
    return;
  }
  var html = '';
  resultados.forEach(function(r) {
    var i = talleMinimo(r[1], r[2]);
    var valor = i < 0 ? 'Consultar' : TALLES[i];
    html += '<div class="resultado"><div>' + NOMBRES[r[0]] + '</div><div class="talle">' + valor + '</div>' +
      (i < 0 ? '<div class="detalle">Tus medidas superan la tabla más grande (XXL).</div>' : '') + '</div>';
  });
  salida.innerHTML = html;
});
</script>
</body>
</html>
